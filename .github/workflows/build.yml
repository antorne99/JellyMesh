name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  SDK_IMAGE: mcr.microsoft.com/dotnet/sdk:10.0

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build and test
        run: |
          docker run --rm -v "$PWD":/src -v jellymesh-nuget:/root/.nuget/packages -w /src \
            "$SDK_IMAGE" dotnet test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      # The runner creates the folder, so that it can write to it after the container, which runs as root.
      - name: Build the plugin
        run: |
          mkdir -p artifacts
          docker run --rm -v "$PWD":/src -v jellymesh-nuget:/root/.nuget/packages -w /src \
            "$SDK_IMAGE" dotnet build Jellyfin.Plugin.JellyMesh/Jellyfin.Plugin.JellyMesh.csproj \
            -c Release -o artifacts/build --nologo

      - name: Package
        run: .github/scripts/package.sh "$TAG"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip=$(ls artifacts/jellymesh_*.zip)
          md5=$(cut -d' ' -f1 "$zip.md5")
          changelog=$(unzip -p "$zip" meta.json | jq -r .changelog)
          printf '%s\n\nMD5 for manifest.json: %s\n' "$changelog" "$md5" >artifacts/notes.md
          gh release create "$TAG" "$zip" "$zip.md5" "$zip.sha256" --title "JellyMesh $TAG" --notes-file artifacts/notes.md

      # Jellyfin reads the manifest from main, so it changes there and not on the tagged commit.
      - uses: actions/checkout@v4
        with:
          ref: main
          path: published

      - name: Update the manifest
        run: |
          .github/scripts/update-manifest.sh published/manifest.json artifacts/jellymesh_*.zip "$TAG" "$GITHUB_REPOSITORY"
          cd published
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json
          git commit -m "Publish $TAG in the manifest"
          git push origin main
