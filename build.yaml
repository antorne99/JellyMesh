framework: "net10.0"
overview: "Federates multiple Jellyfin servers into one library"
description: >
  JellyMesh shows films and series from other Jellyfin servers in your existing
  libraries and streams them through the local server. Duplicates become one
  title: a local copy always wins, otherwise the best quality does, and the
  other copies stay as backups. Remote servers can be stock Jellyfin or run
  JellyMesh, which adds shared libraries, stream limits and a change feed
  between servers you trust. An admin can merge films that can't be matched
  safely.
category: "General"
owner: "antorne99"
image: "assets/jellymesh.png"
artifacts:
- "Jellyfin.Plugin.JellyMesh.dll"
changelog: >
  Adds a logo, shown in the plugin catalog, and a JellyMesh entry in the Plugins
  section of the Dashboard menu. The federated folder can now be set with the
  JELLYMESH_FEDERATED_ROOT environment variable, which then wins over the plugin
  page. The logo and the menu entry are checked on Jellyfin 12.0 and 12.4, and
  remote playback only on 12.4, with jellyfin-web only: real Android and TV
  clients and QSV are not yet tested.
