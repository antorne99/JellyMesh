changelog: |
  - JellyMesh imports music, music videos, home videos, photos, ebooks, PDFs, comics and audiobooks from other servers, besides films and series. Each imported library gets a type folder of its own, and the libraries JellyMesh makes have the matching type. Playlists and channels are not imported.
  - A remote library with no type is imported too: its films and series go into its Film and Serie folders, and anything else in it is left out.
  - Music videos are matched across servers like films and become versions of one title, with the same fallback, and an admin can merge them by hand on the plugin page. Home videos keep the folders they have on the remote and are never matched.
  - Each track is a .strm in a folder for its album artist and one for its album, inside Musica. Your server answers the requests of players for a track and passes them to the remote, which decides between direct play and transcode; your server never transcodes a federated track. Lyrics are read from the remote.
  - If the server of a track can't play it, the same track plays from another server the user can see, best audio quality first. Tracks have no versions, so an album on two servers shows twice in a library that holds both music folders.
  - Audiobooks play like tracks, with one item for each audio file, its cover and its chapters. A .m4b audiobook downloads as .m4a, a limit of Jellyfin.
  - Ebooks, PDFs and comics get a cover and a placeholder that holds nothing of the book; opening or downloading one reads the file from the remote, and an offline remote gives a clear error.
  - Photos get a placeholder of 1x1 pixel and a thumbnail. Their image is a JPEG from the remote without EXIF data, while Download and File give the original file, with its GPS position if it has one. As in Jellyfin, the image of a photo needs no sign-in.
  - On a federated title Download needs the user's download permission and File only a signed-in user who can see the title, as in Jellyfin, so music apps that stream the file, such as Finamp, need no download permission. The dedicated user on the remote needs none.
  - Metadata protection covers every type: for tracks, books, audiobooks and photos JellyMesh writes the metadata in Jellyfin and locks the item, with no .nfo.
  - The watch state of every type is kept when a server is removed and when two copies of a title become one.
  - Between JellyMesh servers, libraries of music, music videos, home videos, ebooks, comics and audiobooks, and libraries with no type, can be shared too. A connected server never gets the latitude, longitude and altitude of your photos in what it reads of your libraries, but Download, File and an image asked without resizing give it the original file, with its GPS position if it has one.
  - A connected server plays your own .strm files of a shared library only transcoded by your server, never directly; a client of that server that accepts only direct play gets an error for them.
  - Tracks and audiobooks left at the old path after you change the federated folder play only for a signed-in user who can see them, and are never given to a connected server.
  - The plugin page shows the new types with their notes and the merges of music videos, warns about a mixed library that holds the Musica folder of a server, and counts the photos of each server in the sync history.

  Not verified: the scan of 300,000 tracks from three servers, whose time and memory are not measured; Jellyfin 12.2 and 12.3, and 12.1 beyond starting the plugin and opening its database; Finamp, Swiftfin and the other native apps with the new types; the placeholders of CBR, CB7, CBT, MOBI, AZW and AZW3 on Jellyfin; the fallback of a track to another server; playback of the new types with a remote that runs JellyMesh; the side of a connected server for tracks and audiobooks left at the old path; a client that accepts only direct play on your own .strm files through a connected server; a stream slot of a server freed at once when its stream closes while the server is under heavy load; and the whole watch state copied by a server rename for episodes.
