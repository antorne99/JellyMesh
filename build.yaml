changelog: >
  Redesigns the plugin page around the JellyMesh identity, in a dark and a light
  scheme that follow the Jellyfin theme, and shows it in English or Italian
  according to the language set in Jellyfin. After connecting a server, the page
  goes straight to choosing its libraries. Removing a server now deletes its
  content right away, while titles also on another server stay and move to it.
  The first setup step says what to do about the secret key. Remote playback is
  checked only on 12.4, with jellyfin-web only: real Android and TV clients and
  QSV are not yet tested.
