framework: "net10.0"
overview: "Federates multiple Jellyfin servers into one library"
description: >
  JellyMesh shows films and series from other Jellyfin servers in your
  libraries and streams them through the local server. Each server gets its
  own folders, which you add to your libraries or let JellyMesh turn into a
  library per server. A title shows once, with the copies of every server as
  versions: a local copy starts first, otherwise the best quality does.
  Remote servers can be stock Jellyfin or run JellyMesh, which adds shared
  libraries, stream limits and a change feed between servers you trust. An
  admin can merge films and series that can't be matched safely.
category: "General"
owner: "antorne99"
image: "assets/jellymesh.png"
artifacts:
- "Jellyfin.Plugin.JellyMesh.dll"
changelog: |
  - A server you share libraries with now gets only the versions of a title it may see: no longer the copies your server reads from other servers, nor those in libraries you don't share with it. It also can't play them by asking for them.
  - The servers connected to yours drop the versions they no longer get at their next full sync, which runs every night. Update the servers that share libraries; the others need no change.

  Not verified: Jellyfin 12.1, 12.2 and 12.3, as it was checked live on 12.4 only, and the drop of those versions in an incremental sync.
